name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: write  # Required to push to gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # updated to latest node-version
      
      - name: Install dependencies
        working-directory: ./countries
        run: npm ci
      
      - name: Build
        working-directory: ./countries
        run: npm run build -- --configuration=production --base-href=/world_map/
      
      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: countries/dist/hello-world/browser  # ← Added /browser
          branch: gh-pages
